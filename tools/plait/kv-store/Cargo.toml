[package]
name = "vllm-plait-kv-store"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Page store for the vLLM Plait KV connector"
publish = false

[dependencies]
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
